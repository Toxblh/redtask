name: RedTask
options:
  bundleIdPrefix: ru.toxblh
  deploymentTarget:
    iOS: "18.0"
  developmentLanguage: en
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    DEVELOPMENT_TEAM: MUMWZ78YDU
    CODE_SIGN_STYLE: Automatic
    MARKETING_VERSION: "1.1.2"
    CURRENT_PROJECT_VERSION: "1"
    LOCALIZATION_PREFERS_STRING_CATALOGS: YES
    SWIFT_EMIT_LOC_STRINGS: YES
    ENABLE_USER_SCRIPT_SANDBOXING: YES
targets:
  RedTask:
    type: application
    platform: iOS
    sources:
      - path: RedTask
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: ru.toxblh.RedTask
        PRODUCT_NAME: RedTask
        INFOPLIST_FILE: RedTask/Resources/Info.plist
        CODE_SIGN_ENTITLEMENTS: RedTask/Resources/RedTask.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        TARGETED_DEVICE_FAMILY: "1,2"
        SUPPORTS_MACCATALYST: NO
        GENERATE_INFOPLIST_FILE: NO
  RedTaskTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: RedTaskTests
    dependencies:
      - target: RedTask
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: ru.toxblh.RedTaskTests
        GENERATE_INFOPLIST_FILE: YES
        BUNDLE_LOADER: $(TEST_HOST)
        TEST_HOST: $(BUILT_PRODUCTS_DIR)/RedTask.app/RedTask
  RedTaskUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: RedTaskUITests
    dependencies:
      - target: RedTask
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: ru.toxblh.RedTaskUITests
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: RedTask
schemes:
  RedTask:
    build:
      targets:
        RedTask: all
        RedTaskTests: [test]
    test:
      targets:
        - RedTaskTests
  # UI-тесты отдельной схемой: tools/build.sh test их не гоняет (медленные), tools/build.sh uitest — только их
  RedTaskUI:
    build:
      targets:
        RedTask: all
        RedTaskUITests: [test]
    test:
      targets:
        - RedTaskUITests
